name: Build APK

# Runs entirely on GitHub's cloud servers — nothing downloads to your computer
# except the final APK, which you grab from the "Artifacts" section once it's done.
on:
  workflow_dispatch: # lets you click "Run workflow" manually on the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (generates the android/ project fresh each run)
        run: npx cap add android

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Set up Java (required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yangon-taxi-fare-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
