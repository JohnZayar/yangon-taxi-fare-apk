name: Build APK

# Runs entirely on GitHub's cloud servers — nothing downloads to your computer
# except the final APK, which you grab from the "Artifacts" section once it's done.
on:
  workflow_dispatch: # lets you click "Run workflow" manually on the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (generates the android/ project fresh each run)
        run: npx cap add android

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Add Location permissions to AndroidManifest.xml
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');
          const perms = '    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n';
          if (!xml.includes('ACCESS_FINE_LOCATION')) {
            xml = xml.replace(/(<manifest[^>]*>)/, '\$1\n' + perms);
            fs.writeFileSync(path, xml);
            console.log('Location permissions injected into AndroidManifest.xml');
          } else {
            console.log('Location permissions already present, skipping');
          }
          "
      - name: Show final AndroidManifest.xml (for verification in the build log)
        run: cat android/app/src/main/AndroidManifest.xml

      - name: Set up Java (required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yangon-taxi-fare-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
